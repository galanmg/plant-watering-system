; Hub firmware — ESP32-WROOM-32U (external antenna variant, same MCU/board
; target as a plain WROOM-32 — the "U" only changes the antenna connector).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Slower, more reliable upload speed — this board's CP2102 auto-reset drops
; the connection at the default 460800 baud ("no serial data received").
upload_speed = 115200
